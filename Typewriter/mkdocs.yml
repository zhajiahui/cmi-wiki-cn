site_name: Typewriter 中文 Wiki
site_url: https://zhajiahui.github.io/cmi-wiki-cn/typewriter/
theme:
  name: material
  language: zh
  font: false
plugins:
- search:
    lang:
    - zh
    - en
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.superfences
nav:
- 前言: index.md
- 使用文档:
  - 入门:
    - 概览: docs/getting-started.md
    - 安装指南: docs/getting-started/installation.md
    - 界面布局: docs/getting-started/layout.md
  - 编写故事:
    - 第一个交互:
      - 概览: docs/creating-stories/interactions.md
      - 添加选项: docs/creating-stories/interactions/options.md
      - 给予物品: docs/creating-stories/interactions/items.md
      - 条件对话: docs/creating-stories/interactions/conditional-dialogue.md
      - 随机对话: docs/creating-stories/interactions/dynamic-variables.md
    - 过场动画:
      - 概览: docs/creating-stories/cinematics.md
      - 添加对话: docs/creating-stories/cinematics/dialogue.md
      - 添加实体: docs/creating-stories/cinematics/entities.md
      - 首次加入时播放过场动画: docs/creating-stories/cinematics/first-join.md
      - 可跳过的过场动画: docs/creating-stories/cinematics/skippable-cinematics.md
      - 指定世界的过场动画: docs/creating-stories/cinematics/world-specific.md
    - 事实: docs/creating-stories/facts.md
    - 实体与 NPC:
      - 概览: docs/creating-stories/entity-extension.md
      - 与实体交互: docs/creating-stories/entity-extension/interacting.md
      - 按条件显示 NPC: docs/creating-stories/entity-extension/conditional-showing.md
      - 实体活动: docs/creating-stories/entity-extension/activities.md
    - 任务系统:
      - 概览: docs/creating-stories/questing.md
      - 与 NPC 对话目标: docs/creating-stories/questing/talk-objective.md
      - 击杀僵尸目标: docs/creating-stories/questing/kill-zombie-objective.md
      - 显示任务: docs/creating-stories/questing/displaying_quests.md
    - 道路网络: docs/creating-stories/road-network.md
    - 进阶交互:
      - 概览: docs/creating-stories/advanced-interactions.md
      - 交互上下文: docs/creating-stories/advanced-interactions/interaction-context.md
      - 自定义命令: docs/creating-stories/advanced-interactions/custom-commands.md
      - 交互边界:
        - 概览: docs/creating-stories/advanced-interactions/interaction-bounds.md
        - 选项边界: docs/creating-stories/advanced-interactions/interaction-bounds/option-bound.md
  - 概念:
    - 概览: docs/concepts.md
    - 呈现条目: docs/concepts/Manifest.md
    - 受众条目: docs/concepts/Audience.md
  - 辅助功能:
    - 章节: docs/helpful-features/chapters.md
    - 命令: docs/helpful-features/commands.md
    - PlaceholderAPI: docs/helpful-features/placeholderapi.md
    - 快捷键: docs/helpful-features/shortcuts.md
    - 片段（Snippets）: docs/helpful-features/snippets.md
  - 疑难解答:
    - 概览: docs/troubleshooting.md
    - 扩展问题排查: docs/troubleshooting/extensions.md
    - PacketEvents 问题排查: docs/troubleshooting/packetevent.md
    - Playit.gg: docs/troubleshooting/playitgg.md
    - 网页面板加载问题排查: docs/troubleshooting/ports.md
