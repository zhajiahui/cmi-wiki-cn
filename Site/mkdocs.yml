repo_name: zhajiahui/cmi-wiki-cn
edit_uri: edit/main/
use_directory_urls: true
exclude_docs: ''
copyright: 各插件原文与资源归各自作者所有。
dev_addr: 127.0.0.1:8000
watch:
- ../CMI/docs
- ../Residence/docs
- ../Typewriter/docs
